# Sources the Intel121 newswire polls each run. Data, not logic — poll.py re-reads this
# file every run, so an edit takes effect on the next tick.
#
# The list is not a guess. It is drawn from what the Intel121 team actually posted in
# #possible-content-to-push over the 14 days to 2026-09-11 (285 posts): WSJ 39, Bloomberg
# 25, NYT 17, CNBC 13, AP 12, FT 12, Reuters 8, Semafor 7, Axios 7, Calcalist 6, Times of
# Israel 5, The Atlantic 5, Politico 7 (US + Europe), Globes 4, The Information 4, The
# National 3, Middle East Eye 3, White House 3, JPost 3, The Free Press 3 — plus the
# long tail the team reaches for (Puck, Punchbowl, Free Beacon, Al-Monitor, War on the
# Rocks, Intelligence Online, Responsible Statecraft, AGBI, Forbes Middle East, Zawya,
# Treasury, SEC, CENTCOM, Congress). X posts (112), YouTube (23) and podcasts (~25) were
# the biggest share and cannot be polled this way; those stay a human job.
#
# Per-source fields:
#   key             short unique id; the dedup + status label
#   outlet          how it appears in Slack
#   desk            optional parenthetical after the outlet ("Politics", "Middle East")
#   method          rss | gnews | gnews_entity | html
#   url             rss: the feed. gnews: the domain to scope to.
#   query           gnews: extra terms ANDed into the site: search.
#                   gnews_entity: the whole query, NOT restricted to any site.
#   publisher       gnews: accepted publisher names (Google relabels; list variants).
#   threshold       score needed from this source. Lower for outlets that are all
#                   on-beat; higher for general wires and consumer papers.
#   paywall         adds "(paywall)" to the line — an internal reading aid.
#   enabled         optional, defaults true
#
# Run `python poll.py --audit` monthly: a dead feed answers HTTP 200 and serves a web page.

max_items: 20

# Publish-age cap. Real-time was the brief (owner, Sep 11): a 5-minute tick with a
# 10-minute window — the tightest that does not let stories fall between runs. Dedup
# handles novelty; this only caps how old a story may be when first posted.
default_window_minutes: 10

