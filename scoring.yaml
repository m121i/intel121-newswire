# Relevance vocabulary for the Intel121 newswire. Data, not logic — poll.py re-reads this
# every run. Built from Intel121's own material: the clients' standing instructions and
# watchlists, the 638 card titles the desk has published since July (tests/
# headlines_positive.txt), and the 14-day audit of #possible-content-to-push.
#
# The beat, in one sentence: the worlds Intel121's clients track — Israel and the Middle
# East, US foreign policy and the domestic politics of Israel and the Jewish community,
# Gulf sovereign capital, defense tech and cyber, Washington's effect on private capital,
# and sports business. Six anchors, two companions, one threshold. Run
# `python poll.py --selftest` after any edit: it reports recall against the desk's real
# headlines and the pass rate on an off-beat negative set.

default_threshold: 4

# An item must hit at least one of these axes, whatever its score. A place name alone
# is not enough (geography is 2, threshold 4): "Saudi Arabia hosts tennis final" dies,
# "Saudi Arabia's PIF takes stake in tennis tour" lives (geography + entity + sector).
require_anchor: [entity, principal, geography, security, jewish]

# Distinct axes the HEADLINE itself must hit.
min_title_axes: 2
money_points: 1
money_pattern: '\$|\bbillion\b|\bmillion\b|\btrillion\b|\bbn\b|\d+\s?%|\bper cent\b|\bpercent\b'

# Which digest section a story lands in. Checked in order; first match wins; the last
# entry is the default. Labels live in src/digest.py.
default_category: israel_mideast

judge: false

